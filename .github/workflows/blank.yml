name: Build BitChord Prime APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      # 🔥 FIX STEP 1: Agar nested directory hai, toh ye automatically wrapper configure kar dega
      - name: Generate Missing Gradle Wrapper
        run: |
          if [ -d "BitChord-Prime" ]; then
            cd BitChord-Prime && gradle wrapper --gradle-version 8.5 || true
          else
            gradle wrapper --gradle-version 8.5 || true
          fi

      # 🔥 FIX STEP 2: Automatic checking for exact build parameters inside folders
      - name: Assemble Premium Debug APK
        run: |
          if [ -d "BitChord-Prime" ]; then
            cd BitChord-Prime
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      # 🔥 FIX STEP 3: Flexible output path matrix mapping for artifacts
      - name: Upload BitChord Premium APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Prime-Edition
          path: "**/build/outputs/apk/debug/*-debug.apk"

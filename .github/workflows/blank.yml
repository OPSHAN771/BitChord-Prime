name: Build BitChord Prime APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # Step 1: Automatic safely Gradle framework wrapper bootstrapper
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      # Step 2: 🔥 ULTIMATE ROOT FINDER AND DYNAMIC TASK AGENT
      # Yeh command pehle folder structure check karegi, fir dynamic task dhoondh kar run karegi.
      - name: Locate Correct Module and Assemble Premium APK
        run: |
          if [ -d "BitChord-Prime" ]; then
            cd BitChord-Prime
            chmod +x gradlew 2>/dev/null || true
            echo "=== Listing Root Directory Tasks ==="
            gradle tasks --no-daemon
            echo "=== Starting Multiplatform Android Compilation ==="
            gradle :app:assembleDebug --no-daemon || gradle assembleDebug --no-daemon || gradle assemble --no-daemon
          else
            chmod +x gradlew 2>/dev/null || true
            echo "=== Listing Root Directory Tasks ==="
            gradle tasks --no-daemon
            echo "=== Starting Multiplatform Android Compilation ==="
            gradle :app:assembleDebug --no-daemon || gradle assembleDebug --no-daemon || gradle assemble --no-daemon
          fi

      # Step 3: Wildcard automated collector to grab the generated .apk file
      - name: Upload BitChord Premium APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Prime-Edition
          path: "**/build/outputs/apk/debug/*-debug.apk"

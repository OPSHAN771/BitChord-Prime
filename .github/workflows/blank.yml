name: Build BitChord Prime APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # 🔥 FIX STEP 1: Yeh background automation plugin khud fresh, safe wrapper setup karega
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      # 🔥 FIX STEP 2: Automatic folder navigation checking structure execution
      - name: Assemble Premium Debug APK
        run: |
          if [ -d "BitChord-Prime" ]; then
            cd BitChord-Prime
            gradle assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      # 🔥 FIX STEP 3: Dynamic wildcard asset locator for generated binaries
      - name: Upload BitChord Premium APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Prime-Edition
          path: "**/build/outputs/apk/debug/*-debug.apk"

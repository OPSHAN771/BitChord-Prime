name: Build BitChord Prime APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # Safe wrapper automated initialization setup
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      # Explicit modular configuration tracking inside the repository structure
      - name: Assemble Premium Debug APK
        run: |
          if [ -d "BitChord-Prime" ]; then
            cd BitChord-Prime
            gradle :app:assembleDebug --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi

      # Wildcard deployment locator for target binaries output files
      - name: Upload BitChord Premium APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Prime-Edition
          path: "**/build/outputs/apk/debug/*-debug.apk"
